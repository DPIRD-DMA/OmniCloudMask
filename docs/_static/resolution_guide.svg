<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- ================= TITLE ================= -->
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#222">Choosing an inference resolution</text>

  <g transform="translate(0,-32)">
  <!-- ================= RESOLUTION BAR ================= -->
  <!-- bar geometry: x from 120 to 820 -->
  <!-- Below 5m: not supported (resample in) -->
  <rect x="120" y="100" width="120" height="56" rx="6" fill="#eceff1" stroke="#b0bec5" stroke-width="1.5"/>
  <!-- 5-10m: extended (recent models) -->
  <rect x="240" y="100" width="160" height="56" rx="6" fill="#fff3cd" stroke="#e0a800" stroke-width="1.5"/>
  <!-- 10-50m: core / recommended -->
  <rect x="400" y="100" width="420" height="56" rx="6" fill="#d7eddb" stroke="#2e7d32" stroke-width="1.5"/>

  <!-- band labels -->
  <text x="180" y="123" text-anchor="middle" font-size="16" font-weight="600" fill="#546e7a">&lt; 5 m</text>
  <text x="180" y="144" text-anchor="middle" font-size="14" fill="#78909c">resample first</text>

  <text x="320" y="123" text-anchor="middle" font-size="16" font-weight="600" fill="#8a6d00">5 – 10 m</text>
  <text x="320" y="144" text-anchor="middle" font-size="14" fill="#8a6d00">compatible (V3+)</text>

  <text x="610" y="123" text-anchor="middle" font-size="16" font-weight="700" fill="#2e7d32">10 – 50 m  ·  recommended range</text>
  <text x="610" y="144" text-anchor="middle" font-size="14" fill="#3a7d3f">native sweet spot for all model versions</text>

  <!-- tick scale -->
  <line x1="120" y1="166" x2="820" y2="166" stroke="#999" stroke-width="1"/>
  <!-- boundary ticks at 5,10,50 -->
  <g font-size="14" fill="#555">
    <line x1="240" y1="160" x2="240" y2="172" stroke="#999"/>
    <text x="240" y="189" text-anchor="middle">5 m</text>
    <line x1="400" y1="160" x2="400" y2="172" stroke="#999"/>
    <text x="400" y="189" text-anchor="middle">10 m</text>
    <line x1="820" y1="160" x2="820" y2="172" stroke="#999"/>
    <text x="820" y="189" text-anchor="middle">50 m</text>
  </g>

  <!-- ================= EXAMPLE SENSORS (under the scale line) ================= -->
  <g font-size="13.5" fill="#607d8b" text-anchor="middle">
    <line x1="132" y1="166" x2="132" y2="178" stroke="#b0bec5"/>
    <text x="132" y="212">Maxar 30 cm</text>
    <line x1="200" y1="166" x2="200" y2="230" stroke="#b0bec5"/>
    <text x="200" y="246">PlanetScope 3 m</text>
    <line x1="400" y1="166" x2="400" y2="178" stroke="#b0bec5"/>
    <text x="400" y="212">Sentinel-2 10 m</text>
    <line x1="655" y1="166" x2="655" y2="178" stroke="#b0bec5"/>
    <text x="655" y="212">Landsat 30 m</text>
  </g>
  </g>
</svg>
