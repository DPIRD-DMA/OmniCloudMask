# Read the Docs configuration file
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    # Read the Docs clones shallowly; setuptools-scm needs the tags to give the
    # docs the right version
    post_checkout:
      - git fetch --unshallow --tags || git fetch --tags

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt
