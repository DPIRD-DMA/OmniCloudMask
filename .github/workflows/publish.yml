name: Publish to PyPI

# Triggered by pushing a version tag, e.g. `v1.8.0`. The package version comes
# from the tag itself (via setuptools-scm), so there is no version file to bump.
# Publishing uses PyPI trusted publishing (OIDC): no API tokens, no secrets.
# To enable: at https://pypi.org/manage/project/omnicloudmask/settings/publishing/
# add a publisher with:
#   Owner            DPIRD-DMA
#   Repository name  OmniCloudMask
#   Workflow name    publish.yml
#   Environment      pypi

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so setuptools-scm can read tags

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v8.0.0

      - name: Build sdist + wheel
        run: uv build

      # setuptools-scm falls back to a dev version if it can't see the tag, so
      # make sure the files are named for the tag before publishing anything
      - name: Check built version matches tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in "dist/omnicloudmask-$version.tar.gz" "dist/omnicloudmask-$version-py3-none-any.whl"; do
            if [ ! -f "$file" ]; then
              echo "::error::Expected $file for tag $GITHUB_REF_NAME, found: $(ls dist)"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/omnicloudmask
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create releases
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - id: kind
        # A tag of exactly three numbers is a final release; one with a suffix
        # (b1, rc1, ...) is a prerelease, so it isn't marked as the latest release
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.kind.outputs.prerelease }}
