name: Publish to PyPI

# Triggered by pushing a tag that matches the package version, e.g. `v1.8.0`.
# Publishing uses PyPI trusted publishing (OIDC): no API tokens, no secrets.
# To enable: at https://pypi.org/manage/project/omnicloudmask/settings/publishing/
# add a publisher with:
#   Owner            DPIRD-DMA
#   Repository name  OmniCloudMask
#   Workflow name    publish.yml
#   Environment      pypi

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v8.0.0

      # The version lives in omnicloudmask/__version__.py, not in the tag, so make
      # sure they agree before publishing anything
      - name: Check tag matches package version
        run: |
          version=$(python -c "exec(open('omnicloudmask/__version__.py').read()); print(__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Build sdist + wheel
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/omnicloudmask
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create releases
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
